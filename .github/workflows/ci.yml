name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: pcov
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit --coverage-text

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/php-cs-fixer check --diff

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: composer audit

  # Страховка від випадкової runtime-залежності: ядро має лишатися без неї.
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
      - run: composer update --no-dev --no-interaction --no-progress
      - name: no runtime dependencies
        run: |
          deps=$(composer show --no-dev --name-only)
          if [ -n "$deps" ]; then echo "runtime dependencies found:"; echo "$deps"; exit 1; fi
